<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Video Chat Room</title>
    <!-- Include Agora Web SDK v4 -->
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-color: #2a2a2a;
            --text-color: #ffffff;
            --accent-color: #007bff;
            --danger-color: #dc3545;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }
        .setup-panel {
            background-color: var(--card-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .input-group {
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        label {
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #333;
            color: white;
            box-sizing: border-box;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #join-btn { background-color: var(--accent-color); color: white; }
        #leave-btn { background-color: var(--danger-color); color: white; }
        button:disabled { background-color: #555; color: #aaa; cursor: not-allowed; }
        
        #video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
            width: 100%;
        }
        .video-wrapper {
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 4/3;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .video-player {
            width: 100%;
            height: 100%;
        }
        .user-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Static Video Chat Room</h1>
        <p>Hosted on GitHub Pages using WebRTC</p>

        <div class="setup-panel">
            <div class="input-group">
                <label for="app-id">Agora App ID:</label>
                <input type="text" id="app-id" placeholder="Paste your Agora App ID here">
            </div>
            <div class="input-group">
                <label for="token">Temporary Token (Optional for testing, required if security is enabled):</label>
                <input type="text" id="token" placeholder="Paste your Temporary Token here (or leave blank if security is disabled)">
            </div>
            <div class="input-group">
                <label for="channel">Room / Channel Name:</label>
                <input type="text" id="channel" value="main-room" placeholder="Enter room name">
            </div>

            <div class="controls">
                <button id="join-btn">Join Video Room</button>
                <button id="leave-btn" disabled>Leave Room</button>
            </div>
        </div>

        <div id="video-grid"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
