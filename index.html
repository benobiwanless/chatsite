<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Video Chat</title>
    <!-- Include the Agora Web SDK via CDN -->
    <script src="https://agora.io"></script>
    <style>
        #video-container { display: flex; gap: 10px; margin-top: 20px; }
        .video-player { width: 320px; height: 240px; background: black; }
    </style>
</head>
<body>
    <h2>Simple Video Room</h2>
    <button id="join-btn">Join Room</button>
    <button id="leave-btn" disabled>Leave Room</button>
    <div id="video-container"></div>

    <script src="main.js"></script>
</body>
</html>
